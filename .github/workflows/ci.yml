name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src
      - name: Test + Coverage
        run: pytest --cov --cov-report=term-missing
        env:
          VAULT_PATH: "."
          LLM_BASE_URL: "http://localhost:1/v1"
          LLM_API_KEY: "sk-test"
          LLM_MODEL: "test"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workbench-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
