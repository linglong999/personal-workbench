[project]
name = "workbench"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "chromadb>=0.5",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "PyJWT>=2.8",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
warn_unused_ignores = true
follow_imports = "normal"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
ignore_errors = true

[tool.coverage.run]
source = ["src/workbench"]
omit = ["src/workbench/__main__.py"]

[tool.coverage.report]
# 分阶段收紧：B0=50%（已过，实测52.8%）→ B1=70%（已过，实测78.5%）；
# M0 收口（B4/B5 后）达到最终目标 85%。
fail_under = 70